<!DOCTYPE html>
<html>

<head>
    <title>Delete Task</title>
    <script>
        function deleteTask() {
            let id = document.getElementById("taskId").value;

            fetch("tasks.php", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id })
            })
                .then(response => response.json())
                /* Assignment 24/3/25 Redirect back to dashboard
    
                // .then(data => alert(data.message)); 
    
                Old code: It only shows an alert when a task is added, updated, or deleted.
                The user has to manually go back to the dashboard.
    
                */

                //New Code  It shows the alert AND automatically sends the user back to "dashboard.html".

                .then(data => {
                    alert(data.message);
                    window.location.href = "dashboard.html"; // Go back!! 
                });
        }
    </script>
</head>

<body>
    <h2>Delete Task</h2>
    <input type="text" id="taskId" placeholder="Task ID"><br>
    <button onclick="deleteTask()">Delete Task</button>
</body>

</html>
